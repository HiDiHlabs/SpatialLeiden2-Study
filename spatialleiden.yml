name: spatialleiden
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - ipykernel
  - ipywidgets
  - mudata
  - spatialleiden=0.4
  - scanpy=1.10
  - scanorama=1.7
  - snapatac2=2.8
  - dask=2024.11.2
  - anndata=0.10
  - pandas=2
  - pynndescent=0.5.13  # 0.7 returns scipy csr_array kNN graphs, which scanpy 1.10 cannot read (>4,096 cells)
  - setuptools<81  # xarray_schema (via squidpy -> spatialdata) imports pkg_resources, removed in setuptools 81+
  - pip
  - pip:
      - numpy==1.26.4
      - pandas==2.1.1
      - squidpy==1.5.0
      - scanpy[bbknn,skmisc]==1.10.4
      - harmonypy==0.2.0
      - datashader==0.19.1  # imported by spatialdata 0.4 (via squidpy) but not declared as its dependency

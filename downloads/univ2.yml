# UNI2 feature extraction for TCGA-BRCA HE tiles (GPU recommended).
# Create: conda env create -f downloads/univ2.yml
# Activate: conda activate univ2
# Needs UNI2 weights: directory with pytorch_model.bin (MODEL_DIR / --model-dir).

name: univ2
channels:
  - conda-forge
  - pytorch
dependencies:
  - python=3.12
  - pip
  - pandas=2
  - numpy
  - anndata
  - scanpy
  - h5py
  - pillow
  - tqdm
  - pytorch
  - torchvision
  - pip:
      - timm
      - huggingface_hub

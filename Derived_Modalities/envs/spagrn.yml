# SpaGRN 1.1.4 (BGI-Qingdao/SpaGRN) for project C.
# SpaGRN requires Python >=3.8,<3.9 and pins an old stack (setup.py of v1.1.4).
# dask/distributed 2023.5.0 are the last releases supporting Python 3.8;
# numba 0.56 is the last line compatible with numpy 1.23.
# cisTarget databases (hg38 v10) and allTFs_hg38.txt are on the vault: /mnt/masld_vault/cistarget
name: spagrn
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.8
  - numpy=1.23
  - pandas=1.5
  - scipy
  - anndata=0.8
  - scanpy=1.9.3
  - matplotlib-base=3.5.3
  - seaborn=0.12
  - numba=0.56
  - dask=2023.5.0
  - distributed=2023.5.0
  - pyarrow
  - scikit-learn
  - esda
  - pysal
  - ipykernel
  - pip
  - pip:
      - pyscenic==0.12.1
      - hotspotsc==1.1.1
      - spagrn==1.1.4
